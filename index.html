<style>

    --accent: #1B6B58; --accent-press: #145444; --pass: #11683F; --fail: #A8221A; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; background: var(--bg); color: var(--ink);

  button { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-height: 52px; margin: 0; padding: 13px 16px;
    font: inherit; font-size: 17px; font-weight: 600; line-height: 1.25; color: #FFFFFF; background: var(--accent);
    border: 1px solid var(--accent); border-radius: 8px; cursor: pointer; touch-action: manipulation;

  video { display: block; width: 100%; max-height: 52vh; border-radius: 10px; background: #000; aspect-ratio: 3 / 4; object-fit: cover; }

<script>
'use strict';
// Runs on the seller's phone after scanning the QR code in REGEN 360. Results go to the desk through
// Supabase (device_test_* functions, which only accept this session's token). Nothing is stored here.
// Plain ES2017 on purpose (no optional chaining, object spread or optional catch binding): it has to run in
// whatever browser opens the QR code, including iOS 15 Safari and old Android WebViews.
const SUPABASE = 'https://zsocxosthmprsqmzllgd.supabase.co';
const ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inpzb2N4b3N0aG1wcnNxbXpsbGdkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTM5NjY5NzMsImV4cCI6MjA2OTU0Mjk3M30.xuheJiX-w50ghYUXXxnvzj9k-shij9SmZgc8fshA59M';

const token = new URLSearchParams(location.hash.slice(1)).get('t') || '';
history.replaceState(null, '', location.pathname);   // keep the token out of the address bar and history
const app = document.getElementById('app');
const results = { version: 1, tests: {}, userAgent: navigator.userAgent };
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const noop = () => {};
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const CHECK = '<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

// ---- Server ----

// One call. Network failures, timeouts, 5xx and non-JSON answers (a Wi-Fi login page) are marked
// .network so the caller can wait for the connection and try again; other errors are final.
function rpc(name, args) {
  return new Promise((resolve, reject) => {
    let finished = false;
    const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    const timer = setTimeout(() => {
      if (finished) return;
      finished = true;
      if (ctrl) ctrl.abort();
      const e = new Error('Timed out'); e.network = true; reject(e);
    }, 20000);
    const options = {
      method: 'POST', headers: { apikey: ANON_KEY, Authorization: `Bearer ${ANON_KEY}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(args),
    };
    if (ctrl) options.signal = ctrl.signal;
    fetch(`${SUPABASE}/rest/v1/rpc/${name}`, options).then((res) => {
      if (!res.ok) {
        const e = new Error(`Server error ${res.status}`);
        e.network = res.status === 0 || res.status === 408 || res.status === 429 || res.status >= 500;
        throw e;
      }
      return res.json();
    }).then((value) => {
      if (finished) return;
      finished = true; clearTimeout(timer); resolve(value);
    }, (err) => {
      if (finished) return;
      finished = true; clearTimeout(timer);
      const e = err && typeof err === 'object' ? err : new Error(String(err));
      if (e.network !== false) e.network = true;
      reject(e);
    });
  });
}

// "No internet" screen. Shown while the browser says it's offline, and while any call is waiting for the
// connection. Try again (or the connection coming back) retries every waiting call; nothing gathered is lost.
const net = { waiters: [], retrying: 0, offline: false, checking: false, stopped: false, el: null, button: null, timer: 0 };

function netRender() {
  const show = !net.stopped && (net.offline || net.checking || net.waiters.length > 0 || net.retrying > 0);
  if (!show) {
    if (net.el) { net.el.parentNode.removeChild(net.el); net.el = null; net.button = null; }
    clearTimeout(net.timer); net.timer = 0;
    return;
  }
  if (!net.el) {
    net.el = document.createElement('div');
    net.el.className = 'net';
    net.el.innerHTML = `<div><div class="grow"></div><div class="card"><h1>No internet</h1>
      <p>Connect this phone to Wi-Fi or mobile data, then tap Try again.</p></div><div class="grow"></div>
      <button type="button">Try again</button></div>`;
    net.button = net.el.querySelector('button');
    onTap(net.button, netRetry);
    document.body.appendChild(net.el);
    screenAt = Date.now();
  }
  const busy = net.checking || (net.retrying > 0 && net.waiters.length === 0);
  net.button.disabled = busy;
  net.button.textContent = busy ? 'Connecting…' : 'Try again';
  // Waiting calls also retry on their own every few seconds, in case the browser never says it's back online.
  if (net.waiters.length && !net.timer) net.timer = setTimeout(() => { net.timer = 0; netRetry(); }, 8000);
}

function netRetry() {
  clearTimeout(net.timer); net.timer = 0;
  const waiting = net.waiters;
  net.waiters = [];
  net.retrying += waiting.length;
  if (!waiting.length && net.offline) {
    // Only the browser's offline flag: check it again after a moment.
    net.checking = true;
    netRender();
    setTimeout(() => { net.checking = false; net.offline = navigator.onLine === false; netRender(); }, 900);
    return;
  }
  net.offline = false;
  netRender();
  waiting.forEach((go) => go());
}

function netStop() {
  net.stopped = true; net.waiters = []; net.retrying = 0;
  netRender();
}

window.addEventListener('offline', () => { net.offline = true; netRender(); });
window.addEventListener('online', () => { net.offline = false; netRetry(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && net.waiters.length) netRetry(); });

// A call that waits on the "No internet" screen until it gets through. Throws only on final (non-network) errors.
async function call(name, args, onNetworkFailure) {
  let released = false;
  for (;;) {
    let value, error = null;
    try { value = await rpc(name, args); } catch (e) { error = e; }
    if (released) { released = false; net.retrying--; }
    if (!error || !error.network) {
      if (!error) net.offline = false;
      netRender();
      if (error) throw error;
      return value;
    }
    if (onNetworkFailure) onNetworkFailure();
    await new Promise((go) => { net.waiters.push(go); netRender(); });
    released = true;
  }
}

// Each step also carries the results so far, one letter per test in this order (p pass, f fail, s skipped,
// - not done yet), so the desk ticks every test as soon as it's done: "speaker|pp------".
const ORDER = ['touch', 'display', 'speaker', 'microphone', 'rearCamera', 'frontCamera', 'flash', 'vibration'];
const soFar = () => ORDER.map((t) => ({ pass: 'p', fail: 'f', skipped: 's' })[(results.tests[t] || {}).status] || '-').join('');
let progressStep = null, progressBusy = false;
function progress(step) {
  progressStep = step;
  if (!progressBusy) sendProgress();
}
async function sendProgress() {
  progressBusy = true;
  while (progressStep) {
    const step = progressStep;
    progressStep = null;
    try { await call('device_test_progress', { p_token: token, p_step: `${step}|${soFar()}` }); } catch (e) { /* final error: ignore */ }
  }
  progressBusy = false;
}

// ---- Taps ----

// Taps that work in every browser: real <button>s, click plus pointerup (touchend where there are no pointer
// events), so old iOS Safari and in-app viewers that drop clicks still respond. Each tap fires once, and taps
// in the first moment after a screen changes are ignored, so a double tap can't answer the next screen too.
// again (optional) runs when the same tap's click follows a pointerup that already fired: a click always counts
// as a user gesture, so things that need one (starting sound) get a second chance there.
let screenAt = 0;
function onTap(el, fn, again) {
  let last = 0, lastBy = '', down = false, sx = 0, sy = 0;
  const fire = (e) => {
    const now = Date.now();
    if (now - last < 450) {
      if (e.type === 'click' && lastBy === 'pointerup' && again) { lastBy = 'click'; again(e); }
      return;
    }
    if (el.disabled || now - screenAt < 300) return;
    last = now; lastBy = e.type;
    fn(e);
  };
  const moved = (x, y) => Math.abs(x - sx) > 16 || Math.abs(y - sy) > 16;
  if (window.PointerEvent) {
    el.addEventListener('pointerdown', (e) => { down = e.pointerType !== 'mouse'; sx = e.clientX; sy = e.clientY; });
    el.addEventListener('pointerup', (e) => {
      if (!down) return;
      down = false;
      if (!moved(e.clientX, e.clientY)) fire(e);
    });
    el.addEventListener('pointercancel', () => { down = false; });
  } else if ('ontouchstart' in window) {
    el.addEventListener('touchstart', (e) => { const t = e.changedTouches[0]; down = true; sx = t.clientX; sy = t.clientY; }, { passive: true });
    el.addEventListener('touchend', (e) => {
      if (!down) return;
      down = false;
      const t = e.changedTouches[0];
      if (moved(t.clientX, t.clientY)) return;
      if (e.cancelable) e.preventDefault();   // no ghost click
      fire(e);
    });
  }
  el.addEventListener('click', fire);
}

// Waits for one of the screen's [data-pick] buttons. Resolves once; the buttons are disabled after the pick.
// onPick runs inside the tap itself (for things browsers allow only during a tap, like starting audio).
const choose = (onPick) => new Promise((resolve) => {
  const buttons = app.querySelectorAll('[data-pick]');
  let settled = false;
  for (let i = 0; i < buttons.length; i++) {
    const b = buttons[i];
    onTap(b, () => {
      if (settled) return;
      settled = true;
      for (let j = 0; j < buttons.length; j++) buttons[j].disabled = true;
      b.setAttribute('data-chosen', '');
      if (onPick) { try { onPick(b.dataset.pick, b); } catch (e) { /* keep going */ } }
      resolve(b.dataset.pick);
    }, onPick ? () => { try { onPick(b.dataset.pick, b); } catch (e) { /* keep going */ } } : null);
  }
});

// ---- Screens ----

let stepIndex = 0, stepCount = 0;
function screen(html) {
  let bars = '';
  if (stepCount) {
    for (let i = 0; i < stepCount; i++) bars += `<i class="${i < stepIndex ? 'done' : ''}"></i>`;
    bars = `<div class="steps">${bars}</div>`;
  }
  app.innerHTML = bars + html;
  screenAt = Date.now();
  window.scrollTo(0, 0);
}
const record = (name, status, note) => { results.tests[name] = note ? { status, note } : { status }; };
const removeOverlays = () => { const list = document.querySelectorAll('.overlay'); for (let i = 0; i < list.length; i++) list[i].parentNode.removeChild(list[i]); };

function fail(message) {
  stepCount = 0;
  netStop();
  removeOverlays();
  screen(`<div class="grow"></div><div class="card"><h1>${esc(message)}</h1>
    <p>Ask for a new QR code and scan it again.</p></div><div class="grow"></div>`);
}

const hasMedia = () => !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

// ---- Tests ----

async function touchTest() {
  progress('touch');
  screen(`<div class="card"><h1>Touch</h1><p>Slide your finger until every square is filled, edges too.</p></div>
    <div class="grow"></div><button data-pick="go">Start</button>`);
  await choose();
  const cols = 8, rows = Math.max(12, Math.round(cols * innerHeight / innerWidth));
  const total = cols * rows;
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `<div class="grid" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${'<div></div>'.repeat(total)}</div>
    <div class="hint">Fill every square</div><button type="button" class="secondary cant">Some squares won't fill</button>`;
  document.body.appendChild(overlay);
  screenAt = Date.now();
  const cells = overlay.querySelectorAll('.grid div');
  const hint = overlay.querySelector('.hint');
  let hits = 0, width = overlay.clientWidth || innerWidth, height = overlay.clientHeight || innerHeight;
  const resize = () => { width = overlay.clientWidth || innerWidth; height = overlay.clientHeight || innerHeight; };
  window.addEventListener('resize', resize);
  const outcome = await new Promise((resolve) => {
    let settled = false;
    const finish = (value) => { if (!settled) { settled = true; resolve(value); } };
    const mark = (x, y) => {
      const c = cols * Math.max(0, Math.min(rows - 1, Math.floor(y / height * rows))) + Math.max(0, Math.min(cols - 1, Math.floor(x / width * cols)));
      const cell = cells[c];
      if (cell && cell.className !== 'hit') {
        cell.className = 'hit';
        if (++hits === 1) hint.style.display = 'none';
        if (hits === total) finish('pass');
      }
    };
    const touches = (e) => { for (let i = 0; i < e.touches.length; i++) mark(e.touches[i].clientX, e.touches[i].clientY); };
    overlay.addEventListener('touchstart', touches, { passive: true });
    overlay.addEventListener('touchmove', (e) => { if (e.cancelable) e.preventDefault(); touches(e); }, { passive: false });
    // Mouse and pen (touch is handled above).
    if (window.PointerEvent) {
      overlay.addEventListener('pointerdown', (e) => { if (e.pointerType !== 'touch') mark(e.clientX, e.clientY); });
      overlay.addEventListener('pointermove', (e) => { if (e.pointerType !== 'touch' && e.buttons) mark(e.clientX, e.clientY); });
    } else {
      overlay.addEventListener('mousemove', (e) => { if (e.buttons) mark(e.clientX, e.clientY); });
    }
    onTap(overlay.querySelector('.cant'), () => {
      overlay.style.display = 'none';
      screen(`<div class="card"><h1>Some squares won't fill?</h1></div><div class="grow"></div>
        <button class="bad" data-pick="fail">Yes, mark as failed</button><button class="secondary" data-pick="back">Back to the test</button>`);
      choose().then((pick) => {
        if (pick === 'fail') return finish('fail');
        overlay.style.display = '';
        screenAt = Date.now();
      });
    });
  });
  window.removeEventListener('resize', resize);
  overlay.parentNode.removeChild(overlay);
  const covered = Math.round(hits / total * 100);
  record('touch', outcome, outcome === 'fail' ? `${covered}% of the screen responded` : null);
}

async function displayTest() {
  progress('display');
  screen(`<div class="card"><h1>Screen</h1><p>Four colours. Look for dots, lines or patches, then tap for the next.</p></div>
    <div class="grow"></div><button data-pick="go">Start</button>`);
  await choose();
  const colours = ['#ff0000', '#00ff00', '#0000ff', '#ffffff'];
  for (let i = 0; i < colours.length; i++) {
    const overlay = document.createElement('button');
    overlay.type = 'button';
    overlay.className = 'overlay';
    overlay.style.background = colours[i];
    overlay.setAttribute('aria-label', 'Next colour');
    document.body.appendChild(overlay);
    screenAt = Date.now();
    await new Promise((next) => onTap(overlay, next));
    overlay.parentNode.removeChild(overlay);
  }
  screen(`<div class="card"><h1>Any dots, lines or patches?</h1><p>On any of the four colours.</p></div><div class="grow"></div>
    <button data-pick="pass">No, all even</button><button class="bad" data-pick="fail">Yes, I saw marks</button>
    <button class="secondary" data-pick="again">Show again</button>`);
  const pick = await choose();
  if (pick === 'again') return displayTest();
  record('display', pick, pick === 'fail' ? 'Spots, lines or patches seen on the colour screens' : null);
}

// Loudspeaker: a few beeps made here as a WAV file and played through an <audio> element. Media playback
// works without a speech voice, and on iPhones it isn't muted by the silent switch (Web Audio is).
function beepWav(count) {
  const rate = 44100, lead = 0.45, beep = 0.18, gap = 0.34, tail = 0.3, fade = Math.round(0.012 * rate);
  // Lead-in silence: many Android phones drop the first moment of sound while the speaker wakes up.
  const samples = Math.ceil((lead + count * beep + Math.max(0, count - 1) * gap + tail) * rate);
  const buffer = new ArrayBuffer(44 + samples * 2);
  const v = new DataView(buffer);
  const text = (at, s) => { for (let i = 0; i < s.length; i++) v.setUint8(at + i, s.charCodeAt(i)); };
  text(0, 'RIFF'); v.setUint32(4, 36 + samples * 2, true); text(8, 'WAVE');
  text(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  text(36, 'data'); v.setUint32(40, samples * 2, true);
  const length = Math.round(beep * rate);
  for (let b = 0; b < count; b++) {
    const start = Math.round((lead + b * (beep + gap)) * rate);
    for (let i = 0; i < length; i++) {
      const envelope = Math.min(1, i / fade, (length - 1 - i) / fade);   // fade in and out: no clicks
      const t = i / rate;
      const s = 0.82 * envelope * (0.85 * Math.sin(2 * Math.PI * 1000 * t) + 0.15 * Math.sin(2 * Math.PI * 2000 * t));
      v.setInt16(44 + (start + i) * 2, Math.round(s * 32767), true);
    }
  }
  return { url: URL.createObjectURL(new Blob([new Uint8Array(buffer)], { type: 'audio/wav' })), seconds: samples / rate };
}

let player = null, unlocked = false, silenceUrl = '';
function audioSession(type) {
  try { if (navigator.audioSession) navigator.audioSession.type = type; } catch (e) { /* not supported */ }
}
function ensurePlayer() {
  try { if (!player) { player = document.createElement('audio'); player.preload = 'auto'; player.setAttribute('playsinline', ''); } }
  catch (e) { player = null; }
  return player;
}
// Called from the first tap: plays a moment of silence so the <audio> element is allowed to play later.
function unlockAudio() {
  if (!ensurePlayer() || unlocked) return;
  try {
    if (!silenceUrl) silenceUrl = beepWav(0).url;
    player.src = silenceUrl;
    const started = player.play();
    if (started && started.then) started.then(() => { unlocked = true; }, noop); else unlocked = true;
  } catch (e) { /* no audio */ }
}

async function speakerTest() {
  progress('speaker');
  if (!ensurePlayer()) return record('speaker', 'skipped', 'This browser cannot play sound');
  let attempts = 0, last = 0, everPlayed = false;
  for (;;) {
    let count;
    do { count = 2 + Math.floor(Math.random() * 4); } while (count === last);   // 2 to 5, new on a retry
    last = count;
    const sound = beepWav(count);
    screen(`<div class="card"><h1>Loudspeaker</h1><p>Volume up. Tap Play and count the beeps.</p></div>
      <button type="button" id="play">Play</button>
      <div class="card"><p class="label">How many beeps?</p>
        <div class="counts">${[2, 3, 4, 5].map((n) => `<button class="secondary" data-pick="${n}" disabled>${n}</button>`).join('')}</div></div>
      <p id="sound-note" class="center"></p>
      <div class="grow"></div><button class="bad" data-pick="silent">I can't hear anything</button>`);
    const playButton = document.getElementById('play');
    const note = document.getElementById('sound-note');
    const counts = app.querySelectorAll('.counts button');
    let enableTimer = 0;
    const enableCounts = () => { clearTimeout(enableTimer); for (let i = 0; i < counts.length; i++) if (!counts[i].hasAttribute('data-chosen')) counts[i].disabled = false; };
    const beeping = () => player.src === sound.url;   // not the silent unlock clip
    player.onplaying = () => { if (beeping()) { everPlayed = true; note.textContent = ''; } };
    player.onended = () => { if (beeping()) enableCounts(); };
    player.onerror = () => { if (beeping()) note.textContent = "Sound didn't play. Tap Play again."; };
    let tries = 0;
    const play = () => {
      const attempt = ++tries;
      const failed = () => { if (attempt === tries) note.textContent = "Sound didn't play. Tap Play again."; };
      audioSession('playback');
      note.textContent = '';
      try {
        player.pause();
        player.src = sound.url;          // setting src restarts from the beginning (the lead-in is silent)
        const started = player.play();   // started from the tap, so the browser allows it
        const ok = () => {
          everPlayed = true; unlocked = true;
          clearTimeout(enableTimer);
          enableTimer = setTimeout(enableCounts, sound.seconds * 1000 + 1200);   // in case 'ended' never comes
        };
        if (started && started.then) started.then(ok, failed); else ok();
      } catch (e) { failed(); }
      playButton.textContent = 'Play again';
      playButton.className = 'secondary';
    };
    onTap(playButton, play, play);
    const pick = await choose();
    clearTimeout(enableTimer);
    player.onplaying = player.onended = player.onerror = null;
    try { player.pause(); } catch (e) { /* ignore */ }
    URL.revokeObjectURL(sound.url);
    if (pick === 'silent') {
      audioSession('auto');
      if (!everPlayed) return record('speaker', 'skipped', 'This browser could not play sound');
      return record('speaker', 'fail', 'Nothing was heard from the loudspeaker');
    }
    if (+pick === count) { audioSession('auto'); return record('speaker', 'pass'); }
    if (++attempts >= 2) { audioSession('auto'); return record('speaker', 'fail', 'Wrong number of beeps twice - sound unclear or distorted'); }
    screen(`<div class="card"><h1>Not quite</h1><p>Once more, with new beeps.</p></div><div class="grow"></div><button data-pick="go">Try again</button>`);
    await choose();
  }
}

async function microphoneTest() {
  progress('microphone');
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!hasMedia()) return record('microphone', 'skipped', 'This browser cannot open the microphone');
  if (!AC) return record('microphone', 'skipped', 'This browser cannot read the microphone');
  screen(`<div class="card"><h1>Microphone</h1><p>Tap Start, allow the microphone, then say <b>"Hello REGEN"</b>.</p></div>
    <div class="grow"></div><button data-pick="go">Start</button>`);
  let ctx = null;
  // The audio context is made during the tap: browsers start it suspended (silent) otherwise.
  await choose((pick, button) => {
    button.textContent = 'Opening…';
    try { if (!ctx) ctx = new AC(); const r = ctx.resume && ctx.resume(); if (r && r.catch) r.catch(noop); } catch (e) { ctx = null; }
  });
  const closeCtx = () => { try { const r = ctx && ctx.close && ctx.close(); if (r && r.catch) r.catch(noop); } catch (e) { /* ignore */ } };
  let stream;
  // Automatic gain on, like a phone call, so normal speech is picked up at a normal distance.
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } }); }
  catch (e) { closeCtx(); return record('microphone', 'skipped', 'Microphone permission was not given'); }
  if (!ctx) { try { ctx = new AC(); } catch (e) { ctx = null; } }
  if (!ctx) { stream.getTracks().forEach((t) => t.stop()); return record('microphone', 'skipped', 'This browser cannot read the microphone'); }
  const wake = () => { if (ctx.state === 'suspended' && ctx.resume) { const r = ctx.resume(); if (r && r.catch) r.catch(noop); } };
  wake();
  document.addEventListener('touchend', wake, true);
  document.addEventListener('click', wake, true);
  const analyser = ctx.createAnalyser();
  analyser.fftSize = 1024;
  ctx.createMediaStreamSource(stream).connect(analyser);
  const data = new Float32Array(analyser.fftSize);
  const bytes = analyser.getFloatTimeDomainData ? null : new Uint8Array(analyser.fftSize);   // older Safari
  const read = () => {
    if (!bytes) return analyser.getFloatTimeDomainData(data);
    analyser.getByteTimeDomainData(bytes);
    for (let i = 0; i < bytes.length; i++) data[i] = (bytes[i] - 128) / 128;
  };
  screen(`<div class="card"><h1>Say "Hello REGEN"</h1><p>The bar moves when the microphone hears you.</p>
    <div class="meter"><div id="level"></div></div></div><p id="mic-state" class="center">Listening…</p><div class="grow"></div>
    <button class="bad" data-pick="fail">The bar doesn't move</button>`);
  const level = document.getElementById('level');
  const voiced = [];   // times (ms) of frames with voice in them
  let done = false;
  const userGaveUp = choose().then(() => 'fail');
  const heard = new Promise((resolve) => {
    const tick = () => {
      if (done) return;
      read();
      // Loudness in decibels: the bar spans -60 dB (silence) to -15 dB (raised voice); speech at
      // a normal distance sits around -40 to -25 dB, so it fills most of the bar.
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
      const db = 20 * Math.log10(Math.max(Math.sqrt(sum / data.length), 1e-6));
      level.style.width = `${Math.max(0, Math.min(100, (db + 60) / 45 * 100))}%`;
      // Heard once about a quarter of a second of voice falls within two seconds: speech has gaps between
      // syllables, so the voice doesn't have to be continuous.
      const now = Date.now();
      if (db > -42) voiced.push(now);
      while (voiced.length && voiced[0] < now - 2000) voiced.shift();
      if (voiced.length >= 15) resolve('pass'); else requestAnimationFrame(tick);
    };
    tick();
  });
  const outcome = await Promise.race([heard, userGaveUp]);
  done = true;
  document.removeEventListener('touchend', wake, true);
  document.removeEventListener('click', wake, true);
  stream.getTracks().forEach((t) => t.stop());
  closeCtx();
  record('microphone', outcome, outcome === 'fail' ? 'No sound picked up by the microphone' : null);
  if (outcome === 'pass') { screen(`<div class="grow"></div><div class="mark pass">${CHECK}</div><h1 class="center">Heard you</h1><div class="grow"></div>`); await wait(700); }
}

// Every camera lens the browser can open, back and front (iPhone Safari lists each lens: "Back Ultra Wide
// Camera", "Back Camera", "Back Telephoto Camera", "Front Camera"). Combined virtual cameras ("Back Dual
// Camera", "Back Triple Camera") are skipped: they are the same lenses. Zoom buttons appear where the
// camera supports zoom control (most Android phones in Chrome).
function lensName(device, i, count) {
  const label = device.label || '';
  const back = /back|rear|environment/i.test(label) || !/front|user|face/i.test(label);
  const side = back ? 'Back' : 'Front';
  if (/ultra ?wide/i.test(label)) return { back, name: `${side} ultra-wide (0.5×)` };
  if (/tele/i.test(label)) return { back, name: `${side} telephoto (zoom)` };
  if (/^(back|front) camera$/i.test(label.trim())) return { back, name: `${side} camera (1×)` };
  return { back, name: count > 1 ? `${side} camera ${i + 1}` : `${side} camera` };
}

// Where the browser can't list lenses (or gives no ids): the back and front cameras by facing.
const BY_FACING = [{ id: null, facing: 'environment', back: true, name: 'Back camera' }, { id: null, facing: 'user', back: false, name: 'Front camera' }];

async function listLenses() {
  // Labels are only shown after camera permission is given, so open the main camera once first.
  let probe;
  try { probe = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false }); }
  catch (e) { return null; }
  let devices = [];
  try {
    if (navigator.mediaDevices.enumerateDevices) {
      devices = (await navigator.mediaDevices.enumerateDevices())
        .filter((d) => d.kind === 'videoinput' && d.deviceId && !/dual|triple|desk ?view/i.test(d.label));
    }
  } catch (e) { devices = []; }
  probe.getTracks().forEach((t) => t.stop());
  if (!devices.length) return BY_FACING.slice();
  const named = devices.map((d) => Object.assign({ id: d.deviceId }, lensName(d, 0, 1)));
  [named.filter((l) => l.back), named.filter((l) => !l.back)].forEach((group) => {
    group.forEach((l, i) => { if (/camera$/.test(l.name)) l.name = lensName(devices.filter((d) => d.deviceId === l.id)[0], i, group.length).name; });
  });
  // Back lenses first (main camera before the others), then the front.
  const rank = (l) => (l.back ? 0 : 10) + (/1×|camera( 1)?$/.test(l.name) ? 0 : /ultra/.test(l.name) ? 1 : 2);
  return named.sort((a, b) => rank(a) - rank(b));
}

async function lensTest(lens, flashDone) {
  let stream;
  const video = lens.id ? { deviceId: { exact: lens.id } } : { facingMode: lens.facing };
  try { stream = await navigator.mediaDevices.getUserMedia({ video, audio: false }); }
  catch (e) { return { lens: lens.name, status: 'skipped', note: "Couldn't open this camera" }; }
  const track = stream.getVideoTracks()[0];
  const caps = track && track.getCapabilities ? track.getCapabilities() : {};
  const zooms = caps.zoom ? [caps.zoom.min < 1 ? caps.zoom.min : null, 1, 2, 3, 5, 10]
    .filter((z) => z != null && z >= caps.zoom.min && z <= caps.zoom.max) : [];
  screen(`<h1>${esc(lens.name)}</h1><p>Point it at something nearby.${zooms.length > 1 ? ' Try each zoom.' : ''} Is the picture clear?</p>
    <video autoplay playsinline muted></video>
    ${zooms.length > 1 ? `<div class="zooms">${zooms.map((z) => `<button type="button" class="secondary" data-zoom="${z}">${+z.toFixed(1)}×</button>`).join('')}</div>` : ''}
    <div class="grow"></div><button data-pick="pass">Yes, clear</button><button class="bad" data-pick="fail">No: black, blurry or broken</button>`);
  const videoEl = app.querySelector('video');
  videoEl.setAttribute('playsinline', '');
  videoEl.muted = true;
  videoEl.srcObject = stream;
  const playing = videoEl.play && videoEl.play();
  if (playing && playing.catch) playing.catch(noop);
  const zoomButtons = app.querySelectorAll('[data-zoom]');
  for (let i = 0; i < zoomButtons.length; i++) {
    const b = zoomButtons[i];
    onTap(b, () => { track.applyConstraints({ advanced: [{ zoom: +b.dataset.zoom }] }).catch(noop); });
  }
  const pick = await choose();
  if (lens.back && track && !flashDone()) await flashTest(track);
  stream.getTracks().forEach((t) => t.stop());
  return { lens: lens.name, status: pick, note: pick === 'fail' ? `${lens.name}: picture black, blurry or broken` : null };
}

async function camerasTest() {
  progress('rearCamera');
  if (!hasMedia()) {
    record('rearCamera', 'skipped', 'This browser cannot open the camera');
    return record('frontCamera', 'skipped', 'This browser cannot open the camera');
  }
  screen(`<div class="card"><h1>Cameras</h1><p>Tap Start, allow the camera, then check each picture.</p></div>
    <div class="grow"></div><button data-pick="go">Start</button>`);
  await choose((pick, button) => { button.textContent = 'Opening…'; });
  const lenses = await listLenses();
  if (!lenses) {
    record('rearCamera', 'skipped', 'Camera permission was not given');
    return record('frontCamera', 'skipped', 'Camera permission was not given');
  }
  const outcome = { rearCamera: [], frontCamera: [] };
  let flashTried = false;
  for (let i = 0; i < lenses.length; i++) {
    const lens = lenses[i];
    progress(lens.back ? 'rearCamera' : 'frontCamera');
    const r = await lensTest(lens, () => { const done = flashTried; flashTried = true; return done; });
    outcome[lens.back ? 'rearCamera' : 'frontCamera'].push(r);
  }
  // One result per side for the desk: failed if any lens failed; the lens list is kept for the record.
  Object.keys(outcome).forEach((name) => {
    const list = outcome[name];
    if (!list.length) return record(name, 'skipped', `No ${name === 'rearCamera' ? 'back' : 'front'} camera could be opened`);
    const failed = list.filter((l) => l.status === 'fail');
    const tested = list.filter((l) => l.status !== 'skipped');
    const status = failed.length ? 'fail' : tested.length ? 'pass' : 'skipped';
    results.tests[name] = { status, note: failed.length ? failed.map((l) => l.note).join('; ') : `${tested.length} of ${list.length} cameras clear: ${list.map((l) => l.lens).join(', ')}`, lenses: list };
  });
}

async function flashTest(track) {
  const caps = track.getCapabilities ? track.getCapabilities() : {};
  if (!caps.torch) return;   // Safari and many browsers can't control the flash; asked on the desk instead
  progress('flash');
  try { await track.applyConstraints({ advanced: [{ torch: true }] }); }
  catch (e) { return; }
  screen(`<div class="card"><h1>Is the flash on?</h1><p>The light on the back should be shining.</p></div><div class="grow"></div>
    <button data-pick="pass">Yes, it's on</button><button class="bad" data-pick="fail">No</button>`);
  const pick = await choose();
  try { await track.applyConstraints({ advanced: [{ torch: false }] }); } catch (e) { /* ignore */ }
  record('flash', pick, pick === 'fail' ? 'Flash did not light up' : null);
}

async function vibrationTest() {
  if (!('vibrate' in navigator)) return;   // iPhones: asked on the desk instead
  progress('vibration');
  screen(`<div class="card"><h1>Vibration</h1><p>Hold the phone and tap Vibrate.</p></div>
    <button type="button" class="secondary" id="buzz">Vibrate</button><div class="grow"></div>
    <button data-pick="pass">It vibrated</button><button class="bad" data-pick="fail">It didn't vibrate</button>`);
  onTap(document.getElementById('buzz'), () => { try { navigator.vibrate([400, 150, 400]); } catch (e) { /* ignore */ } });
  const pick = await choose();
  record('vibration', pick, pick === 'fail' ? 'No vibration felt' : null);
}

// ---- Flow ----

async function start() {
  if (!/^[0-9a-f]{48}$/.test(token)) return fail('This link is incomplete.');
  net.offline = navigator.onLine === false;
  netRender();
  let session;
  try { session = await call('device_test_open', { p_token: token }); }
  catch (e) { return fail("This link can't be opened."); }
  if (!session) return fail('This test link has expired or was already used.');
  const model = session.model ? String(session.model) : '';
  document.getElementById('model').textContent = model;

  screen(`<div class="card"><p class="label">Phone check</p><h1>${model ? esc(model) : 'This phone'}</h1>
    <p>A few quick tests. About two minutes.</p></div><div class="grow"></div><button data-pick="go">Start</button>`);
  await choose(unlockAudio);

  // Each test with the results it owns: if one can't run in this browser, those are marked skipped and the rest go on.
  const tests = [[touchTest, ['touch']], [displayTest, ['display']], [speakerTest, ['speaker']],
    [microphoneTest, ['microphone']], [camerasTest, ['rearCamera', 'frontCamera']], [vibrationTest, []]];
  stepCount = tests.length;
  for (let i = 0; i < tests.length; i++) {
    stepIndex = i;
    try { await tests[i][0](); }
    catch (e) {
      removeOverlays();
      tests[i][1].forEach((name) => { if (!results.tests[name]) record(name, 'skipped', 'This test could not run in this browser'); });
    }
  }
  stepIndex = stepCount;

  results.completedAt = new Date().toISOString();
  screen(`<div class="grow"></div><p class="center">Sending results…</p><div class="grow"></div>`);
  // Waits on the "No internet" screen until it gets through. If an earlier try may have reached the server
  // (its answer was lost), "already used" means it did.
  let mayHaveArrived = false, ok;
  try { ok = await call('device_test_submit', { p_token: token, p_results: results }, () => { mayHaveArrived = true; }); }
  catch (e) { return fail("Couldn't send the results."); }
  if (!ok && !mayHaveArrived) return fail('This test link has expired or was already used.');
  stepCount = 0;
  netStop();
  screen(`<div class="grow"></div><div class="mark pass">${CHECK}</div><h1 class="center">All done</h1>
    <p class="center">Hand the phone back.</p><div class="grow"></div>`);
}

start();
</script>
</body>
</html>
